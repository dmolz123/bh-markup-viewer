# Render Blueprint (optional). You can also just create a Web Service in the
# Render dashboard pointed at this repo and set the env vars there.
services:
  - type: web
    name: bh-markup-viewer
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # OAuth auto-refresh mode (recommended). Set the real secret values in the
      # Render dashboard; then visit /auth/login once (or set BLUEBEAM_REFRESH_TOKEN).
      - key: BLUEBEAM_CLIENT_ID
        sync: false
      - key: BLUEBEAM_CLIENT_SECRET
        sync: false
      - key: BLUEBEAM_REFRESH_TOKEN
        sync: false
      # Fallback: paste a short-lived access token instead of OAuth.
      - key: BLUEBEAM_TOKEN
        sync: false
      - key: BLUEBEAM_API_BASE
        value: https://api.bluebeam.com
